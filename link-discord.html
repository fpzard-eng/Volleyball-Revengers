<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Discord - Volleyball Revengers</title>
    <script src="https://download.playfab.com/PlayFabClientApi.js"></script>
    <style>
        :root {
            --bg-main: #060709;
            --bg-card: rgba(18, 22, 31, 0.85);
            --text-main: #ffffff;
            --text-muted: #9ba3b4;
            --border-color: rgba(255, 255, 255, 0.15);
            --border-glow: rgba(30, 144, 216, 0.6);
            --accent-glow: rgba(30, 144, 216, 0.4);
            --discord-btn: #5865F2;
            --discord-btn-hover: #4752C4;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .link-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        h2 { margin-bottom: 10px; font-size: 1.8rem; }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; }

        .discord-btn {
            background-color: var(--discord-btn);
            color: #fff;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .discord-btn:hover { background-color: var(--discord-btn-hover); }

        .input-group {
            margin-top: 25px;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .code-input {
            background: rgba(31, 40, 51, 0.6);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 4px;
            font-weight: 800;
            outline: none;
        }

        .code-input:focus {
            border-color: var(--border-glow);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .submit-btn {
            background: linear-gradient(135deg, #1E90D8 0%, #1572a8 100%);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .user-profile {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="link-card">
    <h2>Link Your Discord</h2>
    <p>Connect your Discord account to your Volleyball Revengers profile.</p>

    <div id="login-section">
        <button class="discord-btn" type="button" onclick="loginWithDiscord()">Login with Discord</button>
    </div>

    <div id="code-section" class="input-group">
        <div class="user-profile">
            <img id="avatar" class="user-avatar" src="" alt="Avatar">
            <span id="username" style="font-weight: 700;"></span>
        </div>
        <input type="text" id="link-code" class="code-input" maxlength="7" placeholder="123-456" oninput="formatCodeInput(this)">
        <button class="submit-btn" type="button" onclick="verifyAndLinkCode()">Link to Discord</button>
    </div>

    <div id="status-msg" style="margin-top: 15px; font-size: 0.9rem; font-weight: 600;"></div>
</div>

<script>
    const DISCORD_CLIENT_ID = "1547808053078925332"; 
    const PLAYFAB_TITLE_ID = "1E90D8D";

    let discordUserData = null;

    if (typeof PlayFab !== "undefined") {
        PlayFab.settings.titleId = PLAYFAB_TITLE_ID;
    }

    window.onload = function() {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const accessToken = fragment.get('access_token');

        if (accessToken) {
            fetchDiscordUser(accessToken);
        }
    };

    function loginWithDiscord() {
        const redirectUri = encodeURIComponent(window.location.origin + window.location.pathname);
        const discordAuthUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${redirectUri}&response_type=token&scope=identify`;
        window.location.href = discordAuthUrl;
    }

    function fetchDiscordUser(token) {
        setStatus("Fetching Discord profile...");
        fetch('https://discord.com/api/users/@me', {
            headers: { authorization: `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(user => {
            if (!user || !user.id) throw new Error("Invalid user response");
            discordUserData = user;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('code-section').style.display = 'flex';
            document.getElementById('username').innerText = user.username;
            document.getElementById('avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
            setStatus("");
        })
        .catch(err => {
            showError("Failed to fetch Discord user profile.");
        });
    }

    function formatCodeInput(input) {
        let raw = input.value.replace(/[^0-9]/g, '');
        if (raw.length > 3) {
            input.value = raw.slice(0, 3) + '-' + raw.slice(3, 6);
        } else {
            input.value = raw;
        }
    }

    function verifyAndLinkCode() {
    const digitsOnly = document.getElementById('link-code').value.replace(/\D/g, '');

    if (digitsOnly.length !== 6) {
        showError("Please enter a valid 6-digit code (e.g. 123-456).");
        return;
    }

    const code = `${digitsOnly.slice(0, 3)}-${digitsOnly.slice(3, 6)}`;

    setStatus("Authenticating session with PlayFab...");

    // Ensure Title ID is explicitly attached before making the API call
    if (typeof PlayFab !== "undefined") {
        PlayFab.settings.titleId = PLAYFAB_TITLE_ID;
    }

    PlayFabClientSDK.LoginWithCustomID({
        TitleId: PLAYFAB_TITLE_ID, // Pass directly in request payload as fallback
        CustomId: "DISCORD_LINK_" + code,
        CreateAccount: true
    }, (loginResult, loginError) => {
        if (loginError) {
            console.error("PlayFab Login Error:", loginError);
            showError(`Failed: ${loginError.errorMessage || "Session auth failed"}`);
            return;
        }

        setStatus("Saving Discord connection...");

        PlayFabClientSDK.UpdateUserData({
            Data: {
                "DiscordLinked": "true",
                "DiscordUserId": discordUserData.id,
                "DiscordUsername": discordUserData.username,
                "PendingDiscordCode": code
            }
        }, (updateResult, updateError) => {
            if (updateError) {
                console.error("PlayFab UpdateUserData Error:", updateError);
                showError("Failed to save Discord profile to server.");
                return;
            }

            handleSuccessState("Successfully linked your Discord account!");
        });
    });
}

    function setStatus(msg) {
        const statusMsg = document.getElementById('status-msg');
        statusMsg.style.color = "var(--text-muted)";
        statusMsg.innerText = msg;
    }

    function showError(msg) {
        const statusMsg = document.getElementById('status-msg');
        statusMsg.style.color = "#ff4500";
        statusMsg.innerText = msg;
    }

    function handleSuccessState(message) {
        const statusMsg = document.getElementById('status-msg');
        statusMsg.style.color = "#22c55e";
        statusMsg.innerText = message;
        document.getElementById('link-code').disabled = true;
        document.querySelector('.submit-btn').disabled = true;

        setTimeout(() => {
            window.location.href = "https://fpzard-eng.github.io/Volleyball-Revengers/";
        }, 2000);
    }
</script>
</body>
</html>
