<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Discord - Volleyball Revengers</title>
    <script src="https://download.playfab.com/PlayFabClientApi.js"></script>
    <style>
        :root {
            --bg-main: #060709;
            --bg-card: rgba(18, 22, 31, 0.85);
            --text-main: #ffffff;
            --text-muted: #9ba3b4;
            --border-color: rgba(255, 255, 255, 0.15);
            --border-glow: rgba(30, 144, 216, 0.6);
            --accent-glow: rgba(30, 144, 216, 0.4);
            --discord-btn: #5865F2;
            --discord-btn-hover: #4752C4;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .link-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        h2 { margin-bottom: 10px; font-size: 1.8rem; }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; }

        .discord-btn {
            background-color: var(--discord-btn);
            color: #fff;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .discord-btn:hover { background-color: var(--discord-btn-hover); }

        .input-group {
            margin-top: 25px;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .code-input {
            background: rgba(31, 40, 51, 0.6);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 4px;
            font-weight: 800;
            outline: none;
        }

        .code-input:focus {
            border-color: var(--border-glow);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .submit-btn {
            background: linear-gradient(135deg, #1E90D8 0%, #1572a8 100%);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .user-profile {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="link-card">
    <h2>Link Your Discord</h2>
    <p>Connect your Discord account to your Volleyball Revengers profile.</p>

    <!-- Step 1: Discord Login -->
    <div id="login-section">
        <button class="discord-btn" onclick="loginWithDiscord()">Login with Discord</button>
    </div>

    <!-- Step 2: Enter 6-Digit In-Game Code -->
    <div id="code-section" class="input-group">
        <div class="user-profile">
            <img id="avatar" class="user-avatar" src="" alt="Avatar">
            <span id="username" style="font-weight: 700;"></span>
        </div>
        <input type="text" id="link-code" class="code-input" maxlength="7" placeholder="123-456" oninput="formatCodeInput(this)">
        <button class="submit-btn" onclick="verifyAndLinkCode()">Link to Discord</button>
    </div>

    <div id="status-msg" style="margin-top: 15px; font-size: 0.9rem; font-weight: 600;"></div>
</div>

<script>
    const DISCORD_CLIENT_ID = "1547808053078925332"; 
    const PLAYFAB_TITLE_ID = "1E90D8D";
    const REDIRECT_URI = encodeURIComponent(window.location.origin + window.location.pathname);

    let discordUserData = null;

    // Initialize PlayFab SDK Title ID
    if (typeof PlayFab !== "undefined") {
        PlayFab.settings.titleId = PLAYFAB_TITLE_ID;
    }

    // Check if returning from Discord OAuth2 login
    window.onload = function() {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const accessToken = fragment.get('access_token');

        if (accessToken) {
            fetchDiscordUser(accessToken);
        }
    };

    function loginWithDiscord() {
        const discordAuthUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=identify`;
        window.location.href = discordAuthUrl;
    }

    function fetchDiscordUser(token) {
        fetch('https://discord.com/api/users/@me', {
            headers: { authorization: `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(user => {
            discordUserData = user;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('code-section').style.display = 'flex';
            document.getElementById('username').innerText = user.username;
            document.getElementById('avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
        })
        .catch(err => {
            document.getElementById('status-msg').style.color = "#ff4500";
            document.getElementById('status-msg').innerText = "Failed to fetch Discord user profile.";
        });
    }

    // Formats 123456 into 123-456 dynamically
    function formatCodeInput(input) {
        let raw = input.value.replace(/[^0-9]/g, '');
        if (raw.length > 3) {
            input.value = raw.slice(0, 3) + '-' + raw.slice(3, 6);
        } else {
            input.value = raw;
        }
    }

    // Helper function to safely parse PlayFab JSON-wrapped strings
    function parsePlayFabValue(val) {
        if (!val) return "";
        try {
            return JSON.parse(val);
        } catch (e) {
            return val;
        }
    }

    function verifyAndLinkCode() {
        const rawCode = document.getElementById('link-code').value.trim();
        const code = rawCode.includes('-') ? rawCode : (rawCode.length === 6 ? `${rawCode.slice(0,3)}-${rawCode.slice(3)}` : rawCode);

        if (code.length !== 7 || !code.includes('-')) {
            document.getElementById('status-msg').style.color = "#ff4500";
            document.getElementById('status-msg').innerText = "Please enter a valid 6-digit code (e.g. 123-456).";
            return;
        }

        document.getElementById('status-msg').style.color = "var(--text-muted)";
        document.getElementById('status-msg').innerText = "Verifying code with PlayFab...";

        // Attempt CloudScript Link process first, falling back to direct API calls
        if (typeof PlayFabClientAPI !== "undefined") {
            PlayFabClientAPI.ExecuteCloudScript({
                FunctionName: "LinkDiscord",
                FunctionParameter: {
                    Code: code,
                    DiscordUserId: discordUserData.id,
                    DiscordUsername: discordUserData.username
                }
            }, (result, error) => {
                const resData = result?.data?.FunctionResult;

                if (error || (resData && !resData.success)) {
                    if (resData && resData.alreadyLinked) {
                        handleSuccessState("Account is already linked! Redirecting...");
                    } else {
                        document.getElementById('status-msg').style.color = "#ff4500";
                        document.getElementById('status-msg').innerText = error?.errorMessage || resData?.message || "Invalid or expired code.";
                    }
                } else {
                    handleSuccessState("Successfully linked your Discord account!");
                }
            });
        }
    }

    function handleSuccessState(message) {
        const statusMsg = document.getElementById('status-msg');
        statusMsg.style.color = "#22c55e";
        statusMsg.innerText = message;
        document.getElementById('link-code').disabled = true;
        document.querySelector('.submit-btn').disabled = true;

        setTimeout(() => {
            window.location.href = "https://fpzard-eng.github.io/Volleyball-Revengers/";
        }, 2000);
    }
</script>
</body>
</html>
