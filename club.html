<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Revengers | Club Dashboard</title>
    <script src="https://download.playfab.com/PlayFabClientApi.js"></script>
    <script src="playfab-auth.js"></script>
    <style>
        :root {
            --bg-main: #060709;
            --bg-card: rgba(18, 22, 31, 0.75);
            --bg-card-hover: rgba(28, 34, 48, 0.9);
            --bg-nav: rgba(10, 12, 16, 0.85);
            --text-main: #ffffff;
            --text-muted: #9ba3b4;
            --border-color: rgba(255, 255, 255, 0.12);
            --border-glow: rgba(0, 212, 255, 0.5);
            --accent-glow: rgba(0, 212, 255, 0.25);
            --accent-blue: #00d4ff;
            --accent-pink: #ff007f;
            --success-color: #00ff7f;
            --danger-color: #ff4b4b;
            --shadow-widget: 0 20px 40px rgba(0, 0, 0, 0.6);
            --holo-gradient: linear-gradient(135deg, #00d4ff 0%, #ffffff 50%, #00d4ff 100%);
            --btn-gradient: linear-gradient(135deg, #00d4ff 0%, #0077b6 100%);
            --btn-hover: linear-gradient(135deg, #33e0ff 0%, #0096c7 100%);
            --discord-btn: #5865F2;
            --discord-btn-hover: #4752C4;
        }

        [data-theme="light"] {
            --bg-main: #f4f6f9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(255, 255, 255, 1);
            --bg-nav: rgba(240, 243, 248, 0.9);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.1);
            --border-glow: rgba(220, 38, 38, 0.5);
            --accent-glow: rgba(220, 38, 38, 0.15);
            --accent-blue: #0284c7;
            --accent-pink: #e11d48;
            --shadow-widget: 0 15px 30px rgba(0, 0, 0, 0.08);
            --holo-gradient: linear-gradient(135deg, #dc2626 0%, #1e293b 50%, #dc2626 100%);
            --btn-gradient: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            --btn-hover: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        body::before { content: ''; position: fixed; top: -20%; left: 50%; transform: translateX(-50%); width: 100vw; height: 600px; background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%); pointer-events: none; z-index: 0; }

        .holo-text { background: var(--holo-gradient); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: holoGlow 6s linear infinite; font-weight: 900; }
        @keyframes holoGlow { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 36px; background: var(--bg-nav); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 9999; }
        .header-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .header-logo-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-color); }

        .nav-actions { display: flex; align-items: center; gap: 1rem; position: relative; }
        .theme-toggle-container { display: flex; align-items: center; position: relative; width: 64px; height: 32px; padding: 2px; border-radius: 9999px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.2); cursor: pointer; }
        .theme-toggle-option { flex: 1; text-align: center; font-size: 0.8rem; z-index: 2; pointer-events: none; }
        .theme-toggle-slider { position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%; background: var(--btn-gradient); z-index: 1; }
        [data-theme="light"] .theme-toggle-slider { transform: translateX(32px); }

        .discord-login-btn { background-color: var(--discord-btn); color: #fff; border: none; padding: 10px 18px; font-size: 0.85rem; font-weight: 700; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .discord-login-btn:hover { background-color: var(--discord-btn-hover); transform: translateY(-2px); }

        .menu-btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 14px; font-size: 1rem; font-weight: 800; border-radius: 10px; cursor: pointer; }

        .nav-menu { display: none; position: absolute; top: calc(100% + 14px); right: 0; background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow-widget); width: 220px; padding: 12px; flex-direction: column; gap: 4px; z-index: 9998; }
        .nav-menu.active { display: flex; }
        .nav-menu a { color: var(--text-muted); padding: 10px; text-decoration: none; font-size: 0.9rem; font-weight: 700; border-radius: 8px; display: flex; gap: 8px; }
        .nav-menu a:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }

        .content { flex: 1; width: 100%; max-width: 850px; margin: 40px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 24px; z-index: 1; }

        .card { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 20px; padding: 28px; box-shadow: var(--shadow-widget); position: relative; }
        .card h2 { font-size: 1.25rem; margin-bottom: 18px; color: var(--text-main); font-weight: 800; display: flex; align-items: center; gap: 10px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

        .info-box { background: rgba(0, 0, 0, 0.2); padding: 16px; border-radius: 14px; border: 1px solid var(--border-color); border-left: 4px solid var(--accent-blue); }
        .info-box.invites { border-left-color: var(--accent-pink); }
        .info-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
        .info-value { font-size: 1.15rem; font-weight: 800; margin-top: 6px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-muted); font-weight: 700; }
        input[type="text"] { width: 100%; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus { border-color: var(--accent-blue); box-shadow: 0 0 12px var(--accent-glow); }

        .btn-action { width: 100%; background: var(--btn-gradient); color: #fff; font-weight: 800; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-action:hover { background: var(--btn-hover); transform: translateY(-2px); box-shadow: 0 8px 20px var(--accent-glow); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .status-msg { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; display: none; }
        .status-msg.error { background: rgba(255, 75, 75, 0.1); color: var(--danger-color); border: 1px solid var(--danger-color); }
        .status-msg.success { background: rgba(0, 255, 127, 0.1); color: var(--success-color); border: 1px solid var(--success-color); }

        footer { background: var(--bg-card); border-top: 1px solid var(--border-color); padding: 32px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: auto; }
        .footer-links a { color: var(--text-muted); text-decoration: none; margin: 0 12px; font-weight: 700; font-size: 0.85rem; }
        .footer-links a:hover { color: var(--text-main); }
        .copyright { color: var(--text-muted); font-size: 0.8rem; opacity: 0.6; }
    </style>
</head>
<body>

    <header>
        <a href="home" class="header-brand">
            <img src="logo.png" alt="Logo" class="header-logo-img">
            <span class="logo-text holo-text">Volleyball Revengers</span>
        </a>
        <div class="nav-actions">
            <div id="auth-status-container">
                <button class="discord-login-btn" onclick="redirectToDiscordLogin()">
                    <span>👾</span> Login with Discord
                </button>
            </div>
            <div class="theme-toggle-container" id="themeToggleBtn" title="Toggle Theme">
                <div class="theme-toggle-slider"></div>
                <span class="theme-toggle-option">🌙</span>
                <span class="theme-toggle-option">☀️</span>
            </div>
            <button class="menu-btn" id="menuToggleBtn">☰</button>
            <div class="nav-menu" id="navMenu">
                <a href="updates"><span>🚀</span> Update Log</a>
                <a href="https://discord.gg/xG6QcTbfp2" target="_blank"><span>💬</span> Discord</a>
                <a href="privacy"><span>🛡️</span> Privacy Policy</a>
            </div>
        </div>
    </header>

    <div class="content">
        <h1 class="holo-text" style="font-size: 2.2rem; text-align: center;">Club Dashboard</h1>
        
        <!-- Player & Club Info -->
        <div class="card">
            <h2>🏐 Club Overview</h2>
            <div class="grid-2">
                <div class="info-box">
                    <div class="info-label">Active Club</div>
                    <div class="info-value" id="currentClub">Not Authenticated</div>
                </div>
                <div class="info-box invites">
                    <div class="info-label">Pending Invites</div>
                    <div class="info-value" id="pendingInvites">None</div>
                </div>
            </div>
        </div>

        <!-- Create Club Form -->
        <div class="card">
            <h2>✨ Create a Club</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 18px;">
                Creating a custom club costs <strong>10,000 Aero-Coins</strong>.
            </p>

            <form id="createClubForm" onsubmit="handleCreateClub(event)">
                <div class="form-group">
                    <label for="clubName">Club Name</label>
                    <input type="text" id="clubName" placeholder="e.g. Karasuno High" required>
                </div>

                <div class="form-group">
                    <label for="clubTag">Club Tag (3-4 Characters)</label>
                    <input type="text" id="clubTag" placeholder="e.g. KARA" maxlength="4" required>
                </div>

                <div class="form-group">
                    <label for="practiceDays">Practice Schedule</label>
                    <input type="text" id="practiceDays" placeholder="e.g. Mon, Wed, Fri (8:00 PM)" required>
                </div>

                <button type="submit" id="submitClubBtn" class="btn-action">
                    Create Club (10,000 Aero-Coins)
                </button>
            </form>
            <div id="formStatus" class="status-msg"></div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="https://discord.gg/xG6QcTbfp2">Discord</a>
        </div>
        <div class="copyright">&copy; 2026 Mugen Revolution Studios. All rights reserved.</div>
    </footer>

    <script>
        const API_BASE_URL = window.location.origin.includes('github.io') ? 'https://your-render-app.onrender.com' : '';
        let activePlayFabId = null;
        const menuBtn = document.getElementById('menuToggleBtn');
        const navMenu = document.getElementById('navMenu');
        menuBtn.addEventListener('click', (e) => { e.stopPropagation(); navMenu.classList.toggle('active'); });
        document.addEventListener('click', () => navMenu.classList.remove('active'));

        const themeBtn = document.getElementById('themeToggleBtn');
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('preferred-theme', newTheme);
        });
        document.documentElement.setAttribute('data-theme', localStorage.getItem('preferred-theme') || 'dark');

        function initializeClubSession() {
            if (typeof initPlayFabSession === "function") {
                initPlayFabSession((result, authType, discordUser) => {
                    if (discordUser) {
                        fetchPlayerData(discordUser.id);
                    }
                }, () => {});
            }
        }

        async function fetchPlayerData(discordId) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/user-info?discordId=${encodeURIComponent(discordId)}`);
                const data = await response.json();

                if (data.success) {
                    activePlayFabId = data.playFabId;
                    document.getElementById('currentClub').innerText = data.userData?.ClubName?.Value || 'Free Agent (No Club)';
                    
                    const rawInvites = data.userData?.ClubInvites?.Value;
                    if (rawInvites) {
                        try {
                            const parsed = JSON.parse(rawInvites);
                            document.getElementById('pendingInvites').innerText = Array.isArray(parsed) ? parsed.join(', ') : rawInvites;
                        } catch (e) {
                            document.getElementById('pendingInvites').innerText = rawInvites;
                        }
                    }
                }
            } catch (err) {
                console.error("Failed to load player context:", err);
            }
        }

        function handleCreateClub(event) {
            event.preventDefault();
            const formStatus = document.getElementById('formStatus');
            const submitBtn = document.getElementById('submitClubBtn');

            if (!PlayFabClientSDK.IsClientLoggedIn()) {
                showStatus(formStatus, 'You must be logged in via PlayFab to create a club.', 'error');
                return;
            }

            const clubName = document.getElementById('clubName').value.trim();
            const clubTag = document.getElementById('clubTag').value.trim().toUpperCase();
            const practiceDays = document.getElementById('practiceDays').value.trim();

            submitBtn.disabled = true;
            showStatus(formStatus, 'Processing club creation and deducting Aero-Coins...', 'success');

            // Call PlayFab Cloud Script
            PlayFabClientSDK.ExecuteCloudScript({
                FunctionName: "CreateClubHandler",
                FunctionParameter: {
                    clubName: clubName,
                    clubTag: clubTag,
                    practiceDays: practiceDays
                }
            }, (result, error) => {
                submitBtn.disabled = false;

                if (error) {
                    showStatus(formStatus, `PlayFab Error: ${error.errorMessage}`, 'error');
                    return;
                }

                const scriptResult = result.data.FunctionResult;

                if (scriptResult && scriptResult.success) {
                    showStatus(formStatus, `Success! Club "${clubName}" [${clubTag}] created!`, 'success');
                    document.getElementById('currentClub').innerText = `${clubName} [${clubTag}]`;
                    document.getElementById('createClubForm').reset();
                } else {
                    const failReason = scriptResult?.message || "Club creation failed. Check coin balance.";
                    showStatus(formStatus, failReason, 'error');
                }
            });
        }

        function showStatus(element, text, type) {
            element.style.display = 'block';
            element.className = `status-msg ${type}`;
            element.innerText = text;
        }

        window.onload = initializeClubSession;
    </script>
</body>
</html>
