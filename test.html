<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .circle-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease-in-out;
    }

    .circle-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 30px rgba(99, 102, 241, 0.6);
      background: linear-gradient(135deg, #4f46e5, #9333ea);
    }

    .circle-btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
    }

    .circle-btn svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .circle-btn span {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <button class="circle-btn">
    <svg viewBox="0 0 24 24">
      <path d="M6 11h4M8 9v4" />
      <circle cx="15" cy="10" r="0.5" fill="currentColor" />
      <circle cx="17" cy="12" r="0.5" fill="currentColor" />
      <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.25 2.24-.627 6.47 1.258 8.81a4 4 0 0 0 5.253.91l2.481-1.55a2 2 0 0 1 2.112 0l2.48 1.55a4 4 0 0 0 5.254-.91c1.885-2.34 1.508-6.57 1.257-8.81A4 4 0 0 0 17.32 5z" />
    </svg>
    <span>Matchmaking</span>
  </button>

</body>
</html>
